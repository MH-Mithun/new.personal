<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you januu♥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#241029; --plum:#3b1a43; --blush:#ffd9e2; --rose:#ff5c8a; --gold:#f5c97a; --mist:#c9a9d1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--plum),var(--night) 70%) fixed;color:var(--blush);
  font:400 1.05rem/1.7 "Nunito",system-ui,sans-serif;overflow-x:hidden}
section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4rem 1.5rem}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;margin:0;line-height:1.05}
h1{font-size:clamp(3.2rem,12vw,7.5rem);color:var(--blush)}
h2{font-size:clamp(2.4rem,8vw,4.8rem)}
.sub{max-width:34ch;color:var(--mist);margin:1.4rem 0 2.4rem}
.down{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.memories{max-width:36rem;display:grid;gap:2.2rem;margin-top:2rem}
.memories p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.3}
.memories span{display:block;font:600 .9rem "Nunito",sans-serif;color:var(--gold);margin-top:.4rem;font-style:normal}
.ask{position:relative;min-height:100vh}
.q{color:var(--rose)}
.btns{display:flex;gap:1.2rem;justify-content:center;align-items:center;margin-top:2.6rem;min-height:4.5rem}
button{font:600 1.15rem "Nunito",sans-serif;border:0;border-radius:999px;padding:.95rem 2.4rem;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#yes{background:var(--rose);color:#2a0a17;transition:transform .25s;box-shadow:0 8px 30px rgba(255,92,138,.4)}
#yes:hover{filter:brightness(1.08)}
#no{background:transparent;color:var(--mist);border:1.5px solid var(--mist);transition:left .22s cubic-bezier(.3,1.5,.6,1),top .22s cubic-bezier(.3,1.5,.6,1)}
#no.free{position:fixed;z-index:5}
#taunt{min-height:1.8em;margin-top:1.2rem;color:var(--gold)}
.win{display:none}
.win.on{display:flex}
.win p{max-width:32ch;color:var(--blush);font-size:1.2rem}
.photo{margin:0 0 1.8rem;width:min(74vw,300px);aspect-ratio:4/5;border:7px solid var(--blush);border-radius:14px;overflow:hidden;background:var(--plum);box-shadow:0 18px 50px rgba(0,0,0,.5);transform:rotate(-3deg);display:flex;align-items:center;justify-content:center;font:italic 600 1.6rem "Cormorant Garamond",Georgia,serif;color:var(--rose);line-height:1.6}
.photo img{width:100%;height:100%;object-fit:cover}
.win.on .photo{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.heart{position:fixed;bottom:-2rem;pointer-events:none;color:var(--rose);animation:rise linear forwards;z-index:9}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.float{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.heart{animation-duration:1ms!important}#no,#yes{transition:none}}
</style>
</head>
<body>
<div class="float" id="float"></div>
<main>

<section id="top">
  <h1 id="hername">My love</h1>
  <p class="sub">I built you a little corner of the internet. There’s one question waiting at the end.</p>
  <a class="down" href="#why">Keep scrolling</a>
</section>

<section id="why">
  <h2>A few things I know</h2>
  <div class="memories" id="memories"></div>
</section>

<section class="ask" id="ask">

    <h2>Will you hold my hand  <span class="q">through every chapter of life?</span></h2>
    <div class="btns" id="btns">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
    <p id="taunt" aria-live="polite"></p>
  </div>
  <div class="win" id="win" style="flex-direction:column;align-items:center">
    <figure class="photo" id="photo"><img id="photoimg" alt="Mithun and Surooo" style="display:none"><div class="ph" id="ph">♥<br>Mithun + Surooo<br>♥</div></figure>
    <h2>Labiuuuuuu forever mai lovee ♥</h2>
    <p id="winmsg"></p>
  </div>
</section>

  s.textContent = m[1];
  p.appendChild(s);
  mem.appendChild(p);
});

var yes = document.getElementById("yes"), no = document.getElementById("no");
var taunt = document.getElementById("taunt");
var lines = ["Oops, my finger slipped.","Are you sure about that?","The button doesn’t want to be clicked.","Try the other one.","Nice try, my love.","It’s shy today.","Think of the cake.","Still no? Look at the big pink button.","You can’t catch it.","Just say yes ♥"];
var dodges = 0, scale = 1;

function dodge(){
  dodges++;
  no.classList.add("free");
  var pad = 12, w = no.offsetWidth, h = no.offsetHeight;
  var maxX = window.innerWidth - w - pad, maxY = window.innerHeight - h - pad;
  var yr = yes.getBoundingClientRect(), x, y, tries = 0;
  do {
    x = pad + Math.random() * (maxX - pad);
    y = pad + Math.random() * (maxY - pad);
    tries++;
  } while (tries < 20 && x < yr.right + 20 && x + w > yr.left - 20 && y < yr.bottom + 20 && y + h > yr.top - 20);
  no.style.left = x + "px";
  no.style.top = y + "px";
  taunt.textContent = lines[(dodges - 1) % lines.length];
  scale = Math.min(1 + dodges * 0.07, 1.8);
  yes.style.transform = "scale(" + scale + ")";
}

function near(e){
  if (!no.offsetWidth) return;
  var r = no.getBoundingClientRect(), pad = 70;
  if (e.clientX > r.left - pad && e.clientX < r.right + pad && e.clientY > r.top - pad && e.clientY < r.bottom + pad) dodge();
}
document.addEventListener("pointermove", near);
no.addEventListener("pointerenter", dodge);
no.addEventListener("pointerdown", function(e){ e.preventDefault(); dodge(); });
no.addEventListener("click", function(e){ e.preventDefault(); dodge(); });
no.addEventListener("focus", dodge);
window.addEventListener("resize", function(){ if (no.classList.contains("free")) dodge(); });

function hearts(n){
  for (var i = 0; i < n; i++){
    (function(i){
      setTimeout(function(){
        var h = document.createElement("div");
        h.className = "heart";
        h.textContent = "♥";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (16 + Math.random() * 36) + "px";
        h.style.animationDuration = (3 + Math.random() * 4) + "s";
        document.body.appendChild(h);
        setTimeout(function(){ h.remove(); }, 7500);
      }, i * 90);
    })(i);
  }
}

yes.addEventListener("click", function(){
  no.style.display = "none";
  document.getElementById("askbox").style.display = "none";
  document.getElementById("win").classList.add("on");
  hearts(90);
  setInterval(function(){ hearts(8); }, 1800);
});

/* gentle background hearts */
var fl = document.getElementById("float");
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  setInterval(function(){
    var h = document.createElement("div");
    h.className = "heart";
    h.style.opacity = ".25";
    h.textContent = "♥";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (12 + Math.random() * 18) + "px";
    h.style.animationDuration = (9 + Math.random() * 6) + "s";
    fl.appendChild(h);
    setTimeout(function(){ h.remove(); }, 15500);
  }, 1400);
}
